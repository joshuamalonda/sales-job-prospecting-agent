<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Landly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Let the summary panel sit on its own full-width line under the card content */
        .job-card { flex-wrap: wrap; row-gap: 0; }
        .job-main { flex: 1 1 0; }

        .summary-toggle[aria-expanded="true"] {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Collapsed: zero-height grid row. Open: row grows to fit its content. */
        .summary-panel {
            flex: 0 0 100%;
            display: grid;
            grid-template-rows: 0fr;
            margin-top: 0;
            opacity: 0;
            transition: grid-template-rows 0.25s ease, margin-top 0.25s ease, opacity 0.2s ease;
        }

        .summary-panel.is-open {
            grid-template-rows: 1fr;
            margin-top: 16px;
            opacity: 1;
        }

        .summary-clip {
            min-height: 0;
            overflow: hidden;
        }

        .summary-body {
            padding: 14px 16px;
            font-size: 14px;
            color: var(--text-secondary);
            white-space: pre-line;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        @media (max-width: 640px) {
            .actions { margin-top: 16px; }
            .summary-panel { flex-basis: auto; }
        }

        @media (prefers-reduced-motion: reduce) {
            .summary-panel { transition: none; }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1 class="brand">Landly</h1>
            <p class="subtitle">{{ jobs|length }} UK tech SDR/BDR roles</p>
        </header>

        <form class="filters" method="get" action="/jobs">
            <label class="field">
                <span>City</span>
                <select name="city">
                    <option value="">All cities</option>
                    <option value="London" {% if city == "London" %}selected{% endif %}>London</option>
                    <option value="Manchester" {% if city == "Manchester" %}selected{% endif %}>Manchester</option>
                    <option value="Leeds" {% if city == "Leeds" %}selected{% endif %}>Leeds</option>
                    <option value="United Kingdom" {% if city == "United Kingdom" %}selected{% endif %}>Remote / UK-wide</option>
                </select>
            </label>

            <label class="field">
                <span>Posted</span>
                <select name="days">
                    <option value="">Any time</option>
                    <option value="0" {% if days == 0 %}selected{% endif %}>Today</option>
                    <option value="1" {% if days == 1 %}selected{% endif %}>Since yesterday</option>
                    <option value="7" {% if days == 7 %}selected{% endif %}>Past 7 days</option>
                    <option value="14" {% if days == 14 %}selected{% endif %}>Past 14 days</option>
                    <option value="30" {% if days == 30 %}selected{% endif %}>Past 30 days</option>
                </select>
            </label>

            <button class="btn-primary" type="submit">Filter</button>
        </form>

        <section class="job-list">
            {% for job in jobs %}
            <article class="job-card">
                <div class="job-main">
                    <h2 class="company">{{ job.company_name }}</h2>
                    <p class="title">{{ job.title }}</p>
                    <div class="meta">
                        <span class="place">{{ job.place }}</span>
                        <span class="date">Posted {{ job.date_posted[:10] }}</span>
                    </div>
                </div>
                <div class="actions">
                    <a class="btn-secondary" href="{{ job.company_website }}" target="_blank" rel="noopener">Company site</a>
                    <a class="btn-secondary" href="https://www.glassdoor.co.uk/Search/results.htm?keyword={{ job.company_name|urlencode }}" target="_blank" rel="noopener">Glassdoor</a>
                    <a class="btn-secondary" href="https://www.google.com/search?q=site:repvue.com+{{ job.company_name|urlencode }}" target="_blank" rel="noopener">RepVue</a>
                    <a class="btn-primary" href="{{ job.link }}" target="_blank" rel="noopener">View job</a>
                    <button class="btn-secondary summary-toggle" type="button" aria-expanded="false" aria-controls="summary-{{ loop.index }}" data-company="{{ job.company_name }}">Summary</button>
                </div>
                <div class="summary-panel" id="summary-{{ loop.index }}">
                    <div class="summary-clip">
                        <div class="summary-body"></div>
                    </div>
                </div>
            </article>
            {% endfor %}
        </section>
    </main>

    <script>
        document.querySelectorAll(".summary-toggle").forEach((button) => {
            const panel = document.getElementById(button.getAttribute("aria-controls"));
            const body = panel.querySelector(".summary-body");
            let status = "not-loaded";

            button.addEventListener("click", async () => {
                const isOpen = button.getAttribute("aria-expanded") === "true";
                button.setAttribute("aria-expanded", String(!isOpen));
                panel.classList.toggle("is-open", !isOpen);

                if (isOpen || status !== "not-loaded") return;

                status = "loading";
                body.textContent = "Loading summary...";

                try {
                    const response = await fetch("/summary?company=" + encodeURIComponent(button.dataset.company));
                    if (!response.ok) throw new Error("Request failed: " + response.status);
                    const data = await response.json();
                    if (typeof data.summary !== "string") throw new Error("No summary in response");
                    body.textContent = data.summary;
                    status = "loaded";
                } catch (error) {
                    body.textContent = "Couldn't load summary";
                    status = "not-loaded";
                }
            });
        });
    </script>
</body>
</html>
